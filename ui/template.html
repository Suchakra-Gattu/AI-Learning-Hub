<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="color-scheme" content="light dark">
<script>
  try { var t = localStorage.getItem('theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{prefix}}style.css">
</head>
<body class="{{pageClass}}" data-prefix="{{prefix}}" data-current="{{current}}">
<a class="skip" href="#main">Skip to the lesson</a>
<header class="topbar">
  <button class="icon-btn menu-btn" type="button" aria-label="Open course map" aria-expanded="false" aria-controls="sidebar">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand" href="{{prefix}}index.html">{{siteName}}</a>
  <div class="topbar-right">
    <button class="search-btn" type="button" aria-label="Search lessons">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <span>Search</span><kbd>/</kbd>
    </button>
    <button class="icon-btn theme-btn" type="button" aria-label="Switch light or dark theme">
      <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg>
    </button>
  </div>
</header>
<div class="shell">
  <nav class="sidebar" id="sidebar" aria-label="Course map">
    <div class="progress-wrap">
      <div class="progress-label"><span>Your progress</span><span id="progress-text">0 of 0</span></div>
      <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-fill"></span></div>
    </div>
    {{sidebar}}
    <p class="side-extra"><a href="{{prefix}}glossary.html">Plain-words glossary</a></p>
  </nav>
  <main id="main" class="main">
    {{body}}
  </main>
  <aside class="rail">{{toc}}</aside>
</div>
<div class="scrim" hidden></div>
<dialog class="search" id="search">
  <form method="dialog" class="search-form">
    <input id="search-input" type="search" placeholder="Search for a word or a lesson" autocomplete="off" aria-label="Search lessons">
  </form>
  <ul id="search-results" class="results"></ul>
  <p class="search-hint">Press Esc to close</p>
</dialog>
<script src="{{prefix}}search-index.js"></script>
<script src="{{prefix}}app.js"></script>
</body>
</html>
